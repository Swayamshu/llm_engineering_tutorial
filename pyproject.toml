[project]
name = "tutorials"
version = "0.1.0"
description = "This project is built to learn LLM Engineering. This repo provides various tutorials for the same."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.26.0",
    "httpx>=0.28.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.4",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.3",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.3.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
]

[tool.uv]
package = false
